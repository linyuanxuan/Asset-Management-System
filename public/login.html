<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>登录 · 数字资产台账</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">
  <main class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-slate-900 text-white text-xl font-semibold mb-3">资</div>
      <h1 class="text-xl font-semibold text-slate-900">个人数字资产台账</h1>
      <p class="text-sm text-slate-500 mt-1">本地单机 · 仅限本人访问</p>
    </div>

    <form id="login-form" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4" autocomplete="off">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 mb-1">管理员账号</label>
        <input id="username" name="username" type="text" value="admin" maxlength="64" required
               class="input" autocomplete="username" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">密码</label>
        <input id="password" name="password" type="password" maxlength="200" required
               class="input" autocomplete="current-password" autofocus />
      </div>

      <p id="error" class="hidden text-sm text-red-600"></p>

      <button id="submit" type="submit"
              class="btn-primary w-full justify-center">进入台账</button>

      <p class="text-xs text-slate-400 leading-relaxed pt-1">
        忘记密码？在项目目录执行 <code class="px-1 py-0.5 bg-slate-100 rounded text-slate-600">npm run init -- 新密码</code> 重置。
      </p>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
